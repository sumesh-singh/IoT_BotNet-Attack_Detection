# Enhanced IoT BotScan Configuration
# Complete configuration for all components

data:
  data_paths:
    n_baiot: "./data/raw/n_baiot"
    iot_23: "./data/raw/iot_23"
    bot_iot: "./data/raw/bot_iot"
  chunk_size: 10000
  memory_limit_gb: 8
  use_optimized_loader: true
  max_samples_per_device: 50000
  fine_grained_labels: false  # Set to true for 11-class N-BaIoT labels

feature_engineering:
  create_polynomial_features: false
  create_interaction_features: true
  create_statistical_features: true
  feature_selection_method: 'mutual_info'
  n_features_select: 50

models:
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_split: 5
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

ensemble:
  use_stacking: true
  stacking_cv_folds: 5
  optimize_base_models: false
  stacking_meta_learner: 'logistic'

arm:
  noise_levels: [0.0, 0.05, 0.1, 0.2]
  masking_rates: [0.0, 0.1, 0.2, 0.3]
  burst_intensities: [1.0, 1.5, 2.0]
  confidence_threshold: 0.7
  accuracy_drop_threshold: 0.05
  stability_threshold: 0.1

drift_detection:
  window_size: 100
  p_value_threshold: 0.05
  alert_threshold: 0.1

training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  early_stopping_rounds: 50

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"